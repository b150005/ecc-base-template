# Research Tier Auth Validation — derived-project configuration
#
# See .claude/meta/adr/021-research-tier-auth-validation.md for the full
# design and specs/14-research-tier-validation.md for the authoritative
# scope (eight acceptance criteria, Non-goals, Out of scope).
#
# Single switch: flip `enabled: true` to activate the
# .github/workflows/research-tier-auth-check.yml workflow.
# There is no second `if: false` to remove from the workflow file —
# the single-switch discipline of workaround-tracker.yml /
# coverage-tracker.yml / ecc-delegation-tracker.yml (ADR-021 §7).
#
# Default-off (ADR-021 §7): the detector validates that auth-touching
# verification-review artifacts (shaped like
# .claude/templates/verification-review-template.md with a
# "## Research domain" section) declare T1, not T2 or T3. The template
# commits no verification-review instances, so this detector is
# green-by-construction on the template; the switch is off because the
# template never needs an activation trigger — a derived repo opts in
# with exactly this one change.
#
# AUTH→T1 CONTRACT (protocol.md §"Auth→T1 mandatory rule"):
#   Verification-review outputs whose content concerns any item in the
#   Tier table's T1 scope line (auth, security-sensitive APIs, crypto
#   primitives, etc.) MUST be declared T1. The detector enforces this
#   written contract by scanning artifact content, not only topic lines,
#   closing the gap where "login flow" (auth content, no "auth" keyword
#   in topic) could silently declare T2.
#
# ZERO OPERATOR-ENVIRONMENT INTROSPECTION (AC-8, ADR-021 §Decision 4):
#   The detector reads only in-repo artifacts (verification-review
#   instances + protocol.md). It never reads ~/.claude/ or any
#   operator-level registry.
#
# DERIVED-REPO PATH TRIGGER (operational note):
#   The workflow's `on: paths` filter watches the four scaffold files
#   (protocol.md, the detector, the workflow, this config). Forks have no
#   canonical path convention for verification-review artifacts, so the
#   scaffold cannot pin a glob for them (the #13 ecc-delegation-tracker.yml
#   precedent — the target artifact set is repo-specific). When you enable
#   this check, add your repository's verification-review artifact path
#   (e.g. "verification-reviews/**") to the `on: paths` lists in
#   .github/workflows/research-tier-auth-check.yml so a newly-added
#   mis-classified artifact triggers CI without also touching a scaffold
#   file. This is a derived-repo step, not a template default.

# Master switch for the research-tier-auth-check.yml workflow.
enabled: false
