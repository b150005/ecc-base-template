name: ECC Delegation Consistency Check

# Validates the internal consistency of code-reviewer.md's ECC delegation
# table: every ECC reviewer name in the "Delegate to ECC agent" column must
# be consistent with the intro list of ECC reviewers declared in the same
# file, accounting for the documented flutter-reviewer / dart-reviewer
# indirection. This is milestone #13; the authoritative scope is
# specs/13-ecc-absent-signal.md; the structural decisions are
# .claude/meta/adr/020-ecc-absent-signal.md.
#
# STANDING DEGRADED-REVIEW POSTURE (ADR-020 §5, Spec AC-1):
#   code-reviewer.md's language-specific layer delegates to ECC's
#   *-reviewer agents. When ECC is absent from the operator environment,
#   the language-specific depth is skipped; code-reviewer falls back to its
#   generic checklist and states so explicitly in the verdict. This workflow
#   validates INTERNAL CONSISTENCY of the delegation table, not ECC presence
#   (that is impossible from a repository/CI by construction — ADR-020 §3).
#   See README.md ## Prerequisites for the full standing posture.
#
# STRUCTURAL FORM (ADR-020 §6, mirrors coverage-gate.yml): this is a
# STANDALONE forkable workflow authored ALONGSIDE — NOT as a modification
# of — .github/workflows/ci-base.yml. ci-base.yml is byte-unchanged (Spec
# Out-of-scope / hard constraint).
#
# ACTIVATION POSTURE (ADR-020 §6, Default 2): DEFAULT-OFF behind a SINGLE
# switch — `enabled: true` in .github/ecc-delegation-tracker.yml — the
# coverage-gate.yml / workaround-check.yml precedent. The job's `if:` reads
# that flag and short-circuits otherwise. There is NO second `if: false`
# guard, NO second config key, NO repository variable. The template's
# delegation table is consistent by design, so the detector is
# green-by-construction; the switch is off because a derived repo opts in
# with exactly one change.
#
# SECURITY: `permissions: contents: read` (least privilege, the
# roadmap-drift-check.yml precedent). No caller inputs are interpolated into
# `run:` blocks — all dynamic values are passed via `env:` variables
# (injection-safe). The detector reads only repository artifacts; it never
# reads ~/.claude/ or any operator-level agent registry (ADR-020 §3,
# Spec AC-5).

on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/code-reviewer.md"
      - ".claude/meta/scripts/check-ecc-delegation-consistency.sh"
      - ".github/workflows/ecc-delegation-consistency-check.yml"
      - ".github/ecc-delegation-tracker.yml"
  pull_request:
    paths:
      - ".claude/agents/code-reviewer.md"
      - ".claude/meta/scripts/check-ecc-delegation-consistency.sh"
      - ".github/workflows/ecc-delegation-consistency-check.yml"
      - ".github/ecc-delegation-tracker.yml"

jobs:
  ecc-delegation-consistency-check:
    name: ECC delegation consistency (delegation-table internal consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read ECC delegation activation switch
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          CFG=".github/ecc-delegation-tracker.yml"
          if [ ! -f "$CFG" ]; then
            echo "ECC delegation tracker config missing; consistency check inactive."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Single switch (ADR-020 §6): a lone `enabled:` boolean.
          # Parsed without yq to keep the scaffold dependency-free; the
          # config shape is a single top-level key by design.
          enabled="$(grep -E '^[[:space:]]*enabled:[[:space:]]*(true|false)' "$CFG" \
            | head -n1 \
            | sed -E 's/^[[:space:]]*enabled:[[:space:]]*([a-z]+).*/\1/')"
          echo "enabled=${enabled:-false}" >> "$GITHUB_OUTPUT"

      - name: Run ECC delegation consistency checks
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .claude/meta/scripts/check-ecc-delegation-consistency.sh
