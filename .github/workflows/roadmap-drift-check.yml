name: Roadmap Drift Check

# Verifies Roadmap *index consistency* in .claude/CLAUDE.md (ADR-014): the
# bidirectional `adr:` ↔ `Roadmap row: #NN` contract in BOTH directions, and
# Status-glyph well-formedness. See .claude/meta/scripts/check-roadmap-drift.sh
# and ADR-017 for the rationale; specs/05-roadmap-drift-detection-ci.md is the
# authoritative scope.
#
# ALWAYS-ON: like dangling-ref-check.yml and unlike workaround-check.yml, this
# workflow requires no per-fork configuration. The posture is INHERITED from
# ADR-015's subject-matter-presence rule (§Decision point 3 names #05
# explicitly), not a new decision (ADR-017 §3). Roadmap index consistency is a
# structural contract present in every fork that keeps the Roadmap, so the
# check is always relevant and always enabled. Derived projects that delete the
# Roadmap may delete this workflow, but the default is on.
#
# MECE boundary: this check owns Roadmap index CONSISTENCY; reference
# RESOLUTION is owned by dangling-ref-check.yml (#04). See ADR-017 §2.

on:
  push:
    branches: [main]
    paths:
      - ".claude/CLAUDE.md"
      - ".claude/meta/adr/**"
      - ".claude/meta/scripts/check-roadmap-drift.sh"
      - ".github/workflows/roadmap-drift-check.yml"
  pull_request:
    paths:
      - ".claude/CLAUDE.md"
      - ".claude/meta/adr/**"
      - ".claude/meta/scripts/check-roadmap-drift.sh"
      - ".github/workflows/roadmap-drift-check.yml"

jobs:
  roadmap-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Roadmap drift checks
        run: bash .claude/meta/scripts/check-roadmap-drift.sh
