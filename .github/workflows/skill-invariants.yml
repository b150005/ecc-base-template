name: Skill Invariants

# Verifies the structural invariants for Skills shipped under .claude/skills/.
# See .claude/meta/scripts/check-skill-invariants.sh and
# .claude/meta/adr/007-claude-md-authoring-skill.md for the rationale.
#
# This workflow runs on the template repository itself to protect the
# claude-md-authoring Skill's contract. Derived projects that delete
# .claude/skills/ entirely are also expected to delete this workflow.

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".claude/meta/scripts/check-skill-invariants.sh"
      - ".github/workflows/skill-invariants.yml"
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".claude/meta/scripts/check-skill-invariants.sh"
      - ".github/workflows/skill-invariants.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Skill invariant checks
        run: bash .claude/meta/scripts/check-skill-invariants.sh
