name: Learning Mode Invariants

# Verifies the deterministic preconditions that guard the Developer Learning Mode
# default-off invariant, and (per ADR-010) enforces primary-source-only citations
# in load-bearing documents.
#
# - check-learn-invariants.sh — Learning Mode default-off contract (ADR-001).
# - check-citation-discipline.sh — secondary-source blocklist for ADRs, PRDs,
#   and knowledge entries (ADR-008 / ADR-010).
#
# This workflow runs on the template repository itself to protect these
# contracts. Derived projects that do not intend to maintain Learning Mode are
# expected to delete this workflow file and .claude/meta/ — the template ships
# them only so the contract is verifiable at the source. Derived projects that
# want to keep citation discipline but drop Learning Mode can split the jobs
# into separate workflows.

on:
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/skills/learn/**"
      - ".claude/skills/verification-layer/**"
      - ".claude/learn/**"
      - ".claude/meta/adr/**"
      - ".claude/meta/prd/**"
      - ".claude/verification.yml"
      - ".claude/verification.yml.example"
      - ".gitignore"
      - ".claude/meta/scripts/check-learn-invariants.sh"
      - ".claude/meta/scripts/check-citation-discipline.sh"
      - ".claude/meta/citation-targets.txt"
      - ".github/workflows/learn-invariants.yml"
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/learn/**"
      - ".claude/skills/verification-layer/**"
      - ".claude/learn/**"
      - ".claude/meta/adr/**"
      - ".claude/meta/prd/**"
      - ".claude/verification.yml"
      - ".claude/verification.yml.example"
      - ".gitignore"
      - ".claude/meta/scripts/check-learn-invariants.sh"
      - ".claude/meta/scripts/check-citation-discipline.sh"
      - ".claude/meta/citation-targets.txt"
      - ".github/workflows/learn-invariants.yml"

jobs:
  learn-invariants:
    name: Learning Mode invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Learning Mode invariant checks
        run: bash .claude/meta/scripts/check-learn-invariants.sh

  citation-discipline:
    name: Citation discipline (ADR/PRD/knowledge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run citation-discipline check
        run: bash .claude/meta/scripts/check-citation-discipline.sh
