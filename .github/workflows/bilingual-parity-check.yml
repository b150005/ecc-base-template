name: Bilingual Parity Check

# Verifies EN↔JA translation parity for the template's bilingual paired
# artifacts (ADR-018 + its 2026-05-17 per-pair-granularity amendment).
# Three dimensions: presence parity (no orphaned .ja.md), heading-tree
# parity (level+position, text-blind), and full-width-paren scan.
# See .claude/meta/scripts/check-bilingual-parity.sh and ADR-018 for
# the rationale; specs/06-bilingual-parity-detector.md is the
# authoritative scope.
#
# ALWAYS-ON: like dangling-ref-check.yml and roadmap-drift-check.yml,
# this workflow requires no per-fork configuration. The posture is
# INHERITED from ADR-015's subject-matter-presence rule (§Decision
# point 3 names #06 explicitly), not a new decision (ADR-018 §3).
# Bilingual parity is a structural contract present in every fork that
# carries .ja.md files, so the check is always relevant and always
# enabled. Derived projects with no bilingual artifacts are green by
# construction (no .ja.md → no in-scope pairs → exit 0 automatically).
#
# MECE boundary: this check owns EN↔JA translation PARITY (heading
# tree agreement, full-width-paren scan, orphaned .ja.md detection).
# Reference RESOLUTION is owned by dangling-ref-check.yml (#04).
# Roadmap index CONSISTENCY is owned by roadmap-drift-check.yml (#05).
# See ADR-018 §5.

on:
  push:
    branches: [main]
    paths:
      - "**/*.ja.md"
      - "**/*.md"
      - ".claude/meta/scripts/check-bilingual-parity.sh"
      - ".github/workflows/bilingual-parity-check.yml"
  pull_request:
    paths:
      - "**/*.ja.md"
      - "**/*.md"
      - ".claude/meta/scripts/check-bilingual-parity.sh"
      - ".github/workflows/bilingual-parity-check.yml"

jobs:
  bilingual-parity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run bilingual parity checks
        run: bash .claude/meta/scripts/check-bilingual-parity.sh
