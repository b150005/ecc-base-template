name: Research Tier Auth Validation

# Validates that verification-review artifacts whose content concerns the
# T1 scope (auth, security-sensitive APIs, crypto primitives — the `| T1 |`
# row of protocol.md's Tier table) are declared T1, not T2 or T3. This is
# milestone #14; the authoritative scope is specs/14-research-tier-validation.md
# (eight acceptance criteria, Non-goals, Out of scope); the structural
# decisions are .claude/meta/adr/021-research-tier-auth-validation.md.
#
# AUTH→T1 CONTRACT (ADR-021 §Decision 2c):
#   The written contract lives in protocol.md §"Auth→T1 mandatory rule"
#   immediately under the Tier table — independently readable without
#   consulting orchestrator.md. This workflow enforces that contract
#   by running check-research-tier-auth.sh, which scans artifact CONTENT
#   (not only topic lines) so topic-description omissions are caught.
#   The keyword set is derived at runtime from protocol.md's T1 scope line;
#   an amendment to that line is automatically tracked (R-04, ADR-021 §5).
#
# STRUCTURAL FORM (ADR-021 §7, mirrors ecc-delegation-consistency-check.yml):
#   This is a STANDALONE forkable workflow authored ALONGSIDE — NOT as a
#   modification of — .github/workflows/ci-base.yml. ci-base.yml is
#   byte-unchanged (Spec Out-of-scope / hard constraint).
#
# ACTIVATION POSTURE (ADR-021 §7, Default-off single-switch):
#   DEFAULT-OFF behind a SINGLE switch — `enabled: true` in
#   .github/research-tier-auth-tracker.yml. The job's `if:` reads that flag
#   and short-circuits otherwise. There is NO second `if: false` guard,
#   NO second config key, NO repository variable. The template has no
#   committed verification-review instances, so the detector is
#   green-by-construction; the switch is off because the template never
#   needs activation — a derived repo opts in with exactly one change.
#
# SECURITY: `permissions: contents: read` (least privilege, the
#   roadmap-drift-check.yml precedent). No caller inputs are interpolated
#   into `run:` blocks — all dynamic values are passed via `env:` variables
#   (injection-safe). The detector reads only repository artifacts; it
#   never reads ~/.claude/ or any operator-level agent registry (AC-8,
#   ADR-021 §Decision 4).

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/verification-layer/research/protocol.md"
      - ".claude/meta/scripts/check-research-tier-auth.sh"
      - ".github/workflows/research-tier-auth-check.yml"
      - ".github/research-tier-auth-tracker.yml"
  pull_request:
    paths:
      - ".claude/skills/verification-layer/research/protocol.md"
      - ".claude/meta/scripts/check-research-tier-auth.sh"
      - ".github/workflows/research-tier-auth-check.yml"
      - ".github/research-tier-auth-tracker.yml"

jobs:
  research-tier-auth-check:
    name: Research Tier auth→T1 validation (auth-touching content must declare T1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read research-tier-auth activation switch
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          CFG=".github/research-tier-auth-tracker.yml"
          if [ ! -f "$CFG" ]; then
            echo "Research tier auth tracker config missing; validation inactive."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Single switch (ADR-021 §7): a lone `enabled:` boolean.
          # Parsed without yq to keep the scaffold dependency-free; the
          # config shape is a single top-level key by design.
          enabled="$(grep -E '^[[:space:]]*enabled:[[:space:]]*(true|false)' "$CFG" \
            | head -n1 \
            | sed -E 's/^[[:space:]]*enabled:[[:space:]]*([a-z]+).*/\1/')"
          echo "enabled=${enabled:-false}" >> "$GITHUB_OUTPUT"

      - name: Run research tier auth validation
        if: steps.cfg.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .claude/meta/scripts/check-research-tier-auth.sh
