# Upstream Workaround Tracker — derived-project configuration
#
# See .claude/meta/adr/006-upstream-workaround-tracking.md for the full design.
# See .claude/meta/references/upstream-workaround-tracking.md for usage details.
#
# Single switch: flip `enabled: true` to activate the
# `.github/workflows/workaround-check.yml` workflow. There is no second
# toggle to remove from the workflow file. Until then, every job in the
# workflow short-circuits via `if: steps.cfg.outputs.enabled == 'true'`.

# Master switch for the workaround-check.yml workflow.
enabled: false

# Directory containing per-workaround registry files (NNN-*.md).
# Override if you keep them elsewhere (e.g. "docs/workarounds").
# Validation: must match ^[A-Za-z0-9_./-]+$ and not contain ".." or globs.
registry_dir: workarounds

# When true, the marker-vs-registry consistency check fails the CI job
# on any orphan markers or orphan active entries. When false, mismatches
# are reported in the workflow summary only.
# Recommended: keep `false` until your registry stabilizes, then flip on.
fail_on_marker_drift: false

# When true, the dependabot-annotate job posts (or updates) a sticky
# comment on Dependabot PRs that touch a referenced package. The job
# also requires `enabled: true` above. Set to `false` if you prefer to
# review marker drift via the marker-consistency job alone.
annotate_dependabot_prs: false

# Days before `expires_on` at which to start flagging entries as stale.
# Set to 0 to disable expiry warnings entirely.
expiry_warning_days: 14
