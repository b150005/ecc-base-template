# Anthropic Docs Freshness Tracker — derived-project configuration
#
# See .claude/meta/adr/007-claude-md-authoring-skill.md for the design.
# See .claude/skills/claude-md-authoring/docs-protocol.md for usage.
#
# Single switch: flip `enabled: true` to activate the
# .github/workflows/docs-freshness.yml workflow. While disabled, every
# job in the workflow short-circuits.

# Master switch for the docs-freshness.yml workflow.
enabled: false

# URL of the Claude Code documentation index. The workflow fetches this
# file and diffs it against the previous run's snapshot to detect
# additions, removals, and renames in the documentation surface.
llms_txt_url: https://code.claude.com/docs/llms.txt

# Path where the snapshot is stored. Committed so the diff has a base
# to compare against. Default: .github/.docs-freshness-snapshot.txt
#
# First-run bootstrapping: when this file does not yet exist, the
# workflow logs "First run — no previous snapshot to diff against" and
# does NOT create the file automatically. To start tracking, fetch the
# current llms.txt manually and commit it to the configured path:
#
#   curl -fsSL https://code.claude.com/docs/llms.txt > .github/.docs-freshness-snapshot.txt
#   git add .github/.docs-freshness-snapshot.txt
#   git commit -m "chore: seed docs-freshness snapshot"
#
# Subsequent runs compare against this committed snapshot. Updating
# the snapshot after a verified Anthropic Docs change is also a manual
# commit — keeping the workflow read-only is intentional.
snapshot_path: .github/.docs-freshness-snapshot.txt

# When true, the workflow opens (or reuses) a GitHub issue summarising
# the diff. When false, the diff is reported in the workflow summary
# only. The issue path requires `issues: write` on GITHUB_TOKEN.
open_issue_on_change: false
