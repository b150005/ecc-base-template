# .claude/compliance.yml
#
# Active config for the compliance-checklist Skill (ADR-011, amended 2026-05-20 per Roadmap #20).
#
# This is the COMMITTED ACTIVE configuration. Edit this file to change
# compliance behaviour for your project. The Skill remains default-off
# at the Skill layer (Invariant 4) until BOTH `enabled: true` AND a
# non-empty `target_jurisdictions:` are set. The Skill itself lives at
# `.claude/skills/compliance-checklist/SKILL.md`.
#
# See `.claude/compliance.yml.example` for full field annotations,
# operator_attestations, and reverification_days options. That file
# is documentation-only — it is never read by the Skill.

compliance:
  # Master switch. Default false in the template's committed config.
  # Flip to true once target_jurisdictions is populated by your project.
  # The Skill refuses to run on an empty or absent list (Invariant 5).
  enabled: false

  # Declared jurisdictions for evaluation. EMPTY in the template's
  # committed config — Invariant 5 forbids the template from asserting
  # which legal jurisdictions apply to any given fork. Your project
  # MUST declare at least one of JP / EU / US-CA / platform here
  # before flipping `enabled: true`. The Skill never infers
  # jurisdiction — declaration is a project assertion.
  #
  # Example (uncomment and edit for your project):
  #   - JP
  #   - EU
  #   - US-CA
  #   - platform
  target_jurisdictions: []
